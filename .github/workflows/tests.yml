name: KNOBController tests

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            knob_engine.py \
            linux_backend.py \
            modifier_input.py \
            knob_controller_daemon.py

      - name: Run unit tests
        run: |
          python -m unittest -v
