name: KNOBController release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native-app/tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            x11-utils

      - name: Verify canonical Python runtime
        run: |
          python -m py_compile \
            knob_controller/__init__.py \
            knob_controller/__main__.py \
            knob_controller/daemon.py \
            knob_controller/devices/service.py \
            knob_controller/calibration/service.py \
            devices/decoder.py
          python -m unittest discover -v

      - name: Build Tauri desktop bundles
        working-directory: native-app/tauri
        run: |
          npm ci
          npm run tauri build

      - name: Build integrated Debian package
        run: |
          mkdir -p dist
          TAURI_DEB="$(find native-app/tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)"
          test -n "$TAURI_DEB"
          chmod +x packaging/debian/build-integrated-deb.sh
          packaging/debian/build-integrated-deb.sh "$TAURI_DEB" dist

      - name: Build portable Linux bundle
        run: |
          mkdir -p dist/portable
          APPIMAGE="$(find native-app/tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n1)"
          test -n "$APPIMAGE"
          cp "$APPIMAGE" dist/portable/KNOBController.AppImage
          cp install.sh uninstall.sh dist/portable/
          cp -a knob_controller devices packaging dist/portable/
          cp knob_controller_daemon.py knob_engine.py linux_backend.py modifier_input.py app_context.py knob-controller-agent.py dist/portable/
          chmod +x dist/portable/KNOBController.AppImage dist/portable/install.sh dist/portable/uninstall.sh
          tar -C dist/portable -czf dist/knob-controller-linux-x86_64.tar.gz .
          rm -rf dist/portable

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knob-controller-linux-release
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "KNOBController $TAG" --generate-notes --prerelease
          fi
          gh release upload "$TAG" dist/* --clobber
