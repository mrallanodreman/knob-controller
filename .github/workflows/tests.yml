name: KNOBController tests

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            knob_engine.py \
            linux_backend.py \
            modifier_input.py \
            app_context.py \
            devices/base.py \
            devices/linux_input.py \
            devices/meetion.py \
            devices/generic_hid.py \
            devices/decoder.py \
            devices/custom.py \
            devices/calibration.py \
            devices/registry.py \
            knob_controller/__init__.py \
            knob_controller/__main__.py \
            knob_controller/backends/linux.py \
            knob_controller/devices/service.py \
            knob_controller/calibration/service.py \
            knob_controller/daemon.py \
            knob_controller_daemon.py \
            knob-controller-agent.py 2>&1 | tee compile-output.txt

      - name: Import canonical runtime
        id: import_runtime
        continue-on-error: true
        run: python -c "import knob_controller; import knob_controller.daemon; print(knob_controller.__version__)" 2>&1 | tee import-output.txt

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee test-output.txt

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            compile-output.txt
            import-output.txt
            test-output.txt
          if-no-files-found: warn

      - name: Quality gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.compile.outcome }}" = "success"
          test "${{ steps.import_runtime.outcome }}" = "success"
          test "${{ steps.unit_tests.outcome }}" = "success"
